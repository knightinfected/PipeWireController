[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipewire-control-center"
dynamic = ["version"]                       # single source: pwctl/__init__.py
description = "GTK4/libadwaita control center for PipeWire — patchbay, monitoring, virtual devices, effect inserts, filter chains, HRIR virtual surround, and drop-in config management"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [{ name = "knightinfected", email = "hmzmahmood5@gmail.com" }]
keywords = [
    "pipewire", "wireplumber", "gtk4", "libadwaita", "audio",
    "jack", "filter-chain", "surround", "hrir",
]
classifiers = [
    # NOT PUBLISHED ON PyPI, deliberately. PyPI rejects any upload carrying a
    # classifier it doesn't know, so this line makes an accidental
    # `uv build && uv publish` fail instead of erroring out at the index — or
    # worse, succeeding under a name that isn't ours to take.
    #
    # Two reasons it stays that way:
    #   1. `pip install` cannot produce a working app. GTK 4, libadwaita and
    #      the GObject-Introspection typelibs are system libraries (see the
    #      note on `dependencies` below), so a wheel would install and then
    #      fail to start. Distro packages are the only channel that works.
    #   2. The name `pipewire-controller` on PyPI belongs to an unrelated
    #      project (a PyQt6 tray applet, first released 2026-02-13, so it
    #      predates ours). See issue #4. PEP 541 gives no route to reclaim a
    #      name from an active project, so rather than contest it we renamed:
    #      the distribution, the binary and the desktop entry are all
    #      `pipewire-control-center` as of 2026-08-10. The display name stays
    #      "PipeWire Controller" — that is branding, not a filesystem path,
    #      and nothing collides there.
    "Private :: Do Not Upload",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]

# IMPORTANT: these install from PyPI, but the app also needs SYSTEM libraries
# that pip/uv CANNOT provide — GTK 4, libadwaita (>= 1.4), and the
# GObject-Introspection typelibs PyGObject binds to. Install those from your
# distro (see README > Requirements). At runtime the app also shells out to
# PipeWire/WirePlumber CLI tools (pw-dump, wpctl, pw-metadata, …). So a bare
# `uv sync` sets up the Python deps but does NOT yield a runnable GUI on its
# own — the GTK stack must come from the system.
dependencies = [
    "PyGObject>=3.42",
    "pycairo>=1.20",
    "numpy>=1.24",
    "soundfile>=0.12",
]

[project.urls]
Homepage = "https://github.com/knightinfected/PipeWireController"
Repository = "https://github.com/knightinfected/PipeWireController"
Issues = "https://github.com/knightinfected/PipeWireController/issues"

[project.scripts]
pipewire-control-center = "pwctl.app:main"
# Short alias. NOT `pwctl` — that is one transposition away from `wpctl`,
# WirePlumber's real CLI (which this app shells out to), and the `pw-*` prefix
# belongs to PipeWire's own tools. `pwcc` collides with neither.
pwcc = "pwctl.app:main"

[dependency-groups]
# Dev-only tooling. `uv sync` installs these; none are needed to run the app.
# pygobject-stubs gives BasedPyright/Pyright the gi.repository type info.
dev = [
    "pygobject-stubs>=2.10",
    "basedpyright>=1.12",
    "ruff>=0.5",
]

[tool.hatch.version]
path = "pwctl/__init__.py"                  # reads __version__

[tool.hatch.build.targets.wheel]
packages = ["pwctl"]

[tool.basedpyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
include = ["pwctl"]

[tool.ruff]
target-version = "py310"
line-length = 79
